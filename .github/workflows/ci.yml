name: Rust oracle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: |
          target/release/hip3-oracle-rs --config config/example.json validate
          target/release/hip3-oracle-rs --config config/testnet.example.json validate
          target/release/hip3-oracle-rs --config config/public-btc.dry-run.json validate
          target/release/hip3-oracle-rs --config config/example.json preflight
          target/release/hip3-oracle-rs --config config/example.json once
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install hyperliquid-python-sdk==0.24.0
          python tests/generate_vectors.py
          git diff --exit-code -- tests/sdk_vectors.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hip3-oracle-rs:ci .
      - run: docker run --rm --network none hip3-oracle-rs:ci --config /app/config/example.json once
